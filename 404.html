<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — Cloud CRM</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Страница не найдена. Вернитесь на главную страницу Cloud CRM." />
    <link rel="canonical" href="https://lightweight-cloud-crm.pages.dev/" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #eef5f7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #06131f;
      }
      .card {
        background: rgba(255,255,255,0.9);
        border: 1px solid rgba(255,255,255,0.8);
        border-radius: 28px;
        padding: 48px;
        text-align: center;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(6,19,31,0.08);
      }
      .code { font-size: 72px; font-weight: 800; color: #0f9d8a; line-height: 1; }
      h1 { font-size: 24px; font-weight: 700; margin-top: 16px; }
      p { color: #64748b; margin-top: 12px; font-size: 15px; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 28px;
        background: #0f9d8a;
        color: white;
        padding: 12px 32px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s;
      }
      a:hover { background: #0b7a6a; }
    </style>
    <!-- SPA redirect script -->
    <script>
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Страница не найдена</h1>
      <p>Возможно, ссылка устарела или страница была перемещена. Вернитесь на главную и продолжите работу.</p>
      <a href="/">Вернуться на главную</a>
    </main>
  </body>
</html>
